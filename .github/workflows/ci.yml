name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install: the game has zero runtime dependencies, and pulling Electron into
      # CI to prove nothing is how a repo starts failing on a network flake.
      - name: Syntax check every source
        run: |
          for f in $(git ls-files 'js/*.js' 'js/*/*.js'); do node --check "$f" || exit 1; done
          node --check server.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          for f in $(git ls-files 'tools/*.mjs'); do node --check "$f" || exit 1; done

      # The real gate: every generated board must have one solution and be reachable by
      # pencil logic, re-read by a second implementation that shares no rule table.
      - name: Engine tests
        run: node tools/engine-test.mjs

      # The ladder is a promise, not a caption: `TIERS[].band` is a selection target, and this
      # step goes red if a tier stops landing in its own band or the medians stop ordering.
      - name: Difficulty ladder is still measured
        run: node tools/balance.mjs
        env:
          SAMPLES: "24"

      # The campaign is baked offline and re-derived here: if a rule weight or a pruning pass moved,
      # the seeds land on different boards and this exits non-zero rather than shipping a level list
      # that describes nothing.
      - name: Baked campaign still re-verifies byte for byte
        run: node tools/bake.mjs --check

      - name: Entry files exist
        run: test -f index.html && grep -q '<canvas' index.html && grep -q 'js/main.js' index.html
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # The README/DESIGN promises ("每局唯一解""难度是量出来的""存档写不进 hostile 盘") are held by
  # browser assertions in tools/scenarios.js, and until this job existed those assertions ran only on
  # the machine that wrote them. `check` going green said nothing about the page.
  browser:
    name: real browser gate (both URL shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 22, not the 20 the check job uses: tools/playtest.cjs is a raw CDP driver written against
      # Node's global WebSocket/fetch, which only exist from 22 on. On 20 the very first attach dies
      # with "WebSocket is not defined" and the job goes red before a single assertion runs — the
      # sibling repo loshu learned this by having a locally-green harness fail only on the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Root shape: server.cjs makes the repo the document root, which is the only shape a local
      # machine ever sees. verify.sh refuses to run on ports it did not bind, and a scenario that
      # returns NO RESULT or asserts nothing exits non-zero, so a silently dead harness cannot read
      # green here.
      - name: Browser gate, root shape
        env:
          WD_TIMEOUT: 900
        run: bash tools/verify.sh

      # Prefix shape: Pages actually serves this repo under a path segment
      # (https://z-biz-game.github.io/z-biz-game-tapa-cos/). A root-shaped server cannot tell a
      # leading-slash import from a relative one — that blind spot is why the `save` scenario's
      # `import('/js/store.js')` 404ed on the deployed site while the local gate stayed green,
      # leaving 19 assertions that never ran. So the prefix pass is part of the gate, not a footnote.
      - name: Browser gate, prefix shape (how Pages serves us)
        env:
          WD_TIMEOUT: 900
        run: |
          root=$(mktemp -d)
          ln -s "$GITHUB_WORKSPACE" "$root/z-biz-game-tapa-cos"
          python3 -m http.server 5392 --bind 127.0.0.1 --directory "$root" &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null' EXIT
          for i in $(seq 1 40); do
            curl -fsS -m 2 "http://127.0.0.1:5392/z-biz-game-tapa-cos/" >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS -m 3 "http://127.0.0.1:5392/z-biz-game-tapa-cos/js/main.js" >/dev/null
          curl -fsS -m 3 "http://127.0.0.1:5392/z-biz-game-tapa-cos/js/engine/tapa.js" >/dev/null
          BASE_URL=http://127.0.0.1:5392/z-biz-game-tapa-cos/ bash tools/verify.sh

